# 将本文件复制到每个数据节点的 $ES_PATH_CONF/doc-listener.properties。
# UTF-8 编码，修改后重启节点。缺少文件时插件默认禁用。
doc-listener.enabled=true

# 仅支持 * 和 ? 通配符；逗号分隔。默认排除隐藏/系统索引。
doc-listener.include-indices=orders-*,products,doc-listener-test
doc-listener.exclude-indices=.*

# 队列满直接丢弃并限频告警，不阻塞 ES 写入线程。
# 128 条 * 约 1 MiB 上限，需结合文档大小和 ES 堆内存调整。
doc-listener.queue-capacity=128
# UTF-16 字符数估计的事件驻留大小上限，包含文档和元数据；不是 Kafka 消息字节数。
doc-listener.max-event-bytes=1048576
# 包含 Kafka 异步确认的等待时间；应大于 delivery.timeout.ms + max.block.ms。
doc-listener.send-timeout=15s
# 关闭时尽力排空队列，超时后丢弃剩余消息。
doc-listener.shutdown-timeout=10s

doc-listener.kafka.enabled=true
doc-listener.kafka.bootstrap-servers=localhost:9092
doc-listener.kafka.topic=es-document-changes
# 使用 [属性名] 保留 Kafka 配置键中的点号；密码不要提交到版本库。
doc-listener.kafka.properties[client.id]=es-doc-listener-node-1
doc-listener.kafka.properties[compression.type]=none
doc-listener.kafka.properties[delivery.timeout.ms]=10000
doc-listener.kafka.properties[request.timeout.ms]=5000
doc-listener.kafka.properties[max.block.ms]=1000
# 必须保持 enable.idempotence=true、acks=all、max.in.flight.requests.per.connection=1。
# 首版仅支持 none/gzip 压缩。Kafka 的 max.request.size 和 broker message.max.bytes 需匹配文档大小。

# SASL 示例（按实际环境启用）；该文件应仅允许 ES 运行用户读取。
